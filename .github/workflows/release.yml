name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          name="simplearchpackageinstaller-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "$name"
          cp "target/$TARGET/release/simplearchpackageinstaller" packages.schema.json README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          cp "target/$TARGET/release/simplearchpackageinstaller" simplearchpackageinstaller
          sha256sum "$name.tar.gz" simplearchpackageinstaller > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            simplearchpackageinstaller-*.tar.gz
            simplearchpackageinstaller
            SHA256SUMS
